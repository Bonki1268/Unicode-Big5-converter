<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-tw">
  <head>
    <title>內碼轉換器</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="main.js"></script>
  </head>
  <body>
    <div class="container">
    <header>
      <h1>內碼轉換器</h1>
      <p class="subtitle">把文字轉換成 Big5 或 Unicode 內碼，也能轉回來</p>
    </header>
    <form action="">
      <table>
        <tr>
          <td>原文</td>
          <td></td>
          <td>內碼</td>
        </tr>
        <tr>
          <td><textarea id="character" cols="34" rows="16" placeholder="輸入原文"></textarea></td>
          <td>
            <input
              type="button"
              value="&lt;&lt;"
              onclick="convertToCharacter()"
            /><input
              type="button"
              value="&gt;&gt;"
              onclick="convertToInternalCode()"
            />
          </td>
          <td><textarea id="code" cols="34" rows="16" placeholder="輸入內碼"></textarea></td>
        </tr>
      </table>
      <p>
        進位：
        <input type="radio" name="base" id="binary" checked="checked" /><label
          for="binary"
          >2 進位</label
        >
        <input type="radio" name="base" id="hexadecimal" /><label
          for="hexadecimal"
          >16 進位</label
        >
      </p>
      <p>
        編碼：
        <input type="radio" name="encoding" id="big5" checked="checked" /><label
          for="big5"
          >Big5</label
        >
        <input type="radio" name="encoding" id="unicode" /><label for="unicode"
          >Unicode</label
        >
      </p>
    </form>
    </div>
  </body>
</html>
